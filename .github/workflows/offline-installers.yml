name: Offline Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows-x86_64:
    name: Windows (Intel/AMD x86_64)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install launcher dependencies
        run: python -m pip install -r constraints/windows-launcher.txt
      - name: Build Windows offline installer
        run: python scripts/build_offline_installer.py --out build/offline
      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        with:
          name: FreeVideo-Windows-x86_64
          path: build/offline/windows-x86_64/dist/FreeVideo.exe

  macos-arm64:
    name: macOS (Apple Silicon arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
      - name: Install launcher dependencies
        run: python -m pip install -r constraints/macos-launcher.txt
      - name: Build Apple Silicon offline installer
        run: python scripts/build_offline_installer.py --out build/offline
      - name: Upload Apple Silicon offline installer
        uses: actions/upload-artifact@v4
        with:
          name: FreeVideo-Mac-arm64
          path: build/offline/macos-arm64/dist/FreeVideo-Mac-arm64.dmg

  macos-x86_64:
    name: macOS (Intel x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install launcher dependencies
        run: python -m pip install -r constraints/macos-launcher.txt
      - name: Build Intel Mac offline installer
        run: python scripts/build_offline_installer.py --out build/offline
      - name: Upload Intel Mac offline installer
        uses: actions/upload-artifact@v4
        with:
          name: FreeVideo-Mac-x86_64
          path: build/offline/macos-x86_64/dist/FreeVideo-Mac-x86_64.dmg

  linux-x86_64:
    name: Linux (Intel/AMD x86_64)
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_34_x86_64:2026.10.03-1@sha256:e4ca528d41ab66b3654110295d7a2c7bfa599ddbb6efb269ec21f7f73b88f1b6
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install launcher dependencies
        run: /opt/python/cp312-cp312/bin/python -m pip install -r constraints/linux-launcher.txt
      - name: Build Linux offline installer
        run: /opt/python/cp312-cp312/bin/python scripts/build_offline_installer.py --out build/offline
      - name: Upload Linux offline installer
        uses: actions/upload-artifact@v4
        with:
          name: FreeVideo-Linux-x86_64
          path: build/offline/linux-x86_64/release/FreeVideo-Linux-x86_64.AppImage

  publish-release:
    name: Publish Direct Download Release
    needs: [windows-x86_64, macos-arm64, macos-x86_64, linux-x86_64]
    if: always() && (needs.windows-x86_64.result == 'success' || needs.macos-arm64.result == 'success' || needs.macos-x86_64.result == 'success' || needs.linux-x86_64.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release with Direct Downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'latest-offline' }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          FILES=()
          for f in \
            release-assets/FreeVideo-Windows-x86_64/FreeVideo.exe \
            release-assets/FreeVideo-Mac-arm64/FreeVideo-Mac-arm64.dmg \
            release-assets/FreeVideo-Mac-x86_64/FreeVideo-Mac-x86_64.dmg \
            release-assets/FreeVideo-Linux-x86_64/FreeVideo-Linux-x86_64.AppImage; do
            if [ -f "$f" ]; then
              FILES+=("$f")
            fi
          done
          gh release create "$TAG" "${FILES[@]}" \
            --title "FreeVideo Offline Installers ($TAG)" \
            --notes "Direct offline installers for Windows (Intel/AMD x86_64), macOS (Apple Silicon arm64 & Intel x86_64), and Linux (Intel/AMD x86_64)."
